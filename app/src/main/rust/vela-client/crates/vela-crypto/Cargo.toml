[package]
name = "vela-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vela-proto = { path = "../vela-proto" }
snow = { version = "0.10.0", default-features = false, features = [
  "default-resolver",
  "use-chacha20poly1305",
  "use-sha2",
  "use-curve25519",
  "use-getrandom",
] }
zeroize = { version = "1.9", features = ["derive"] }
thiserror = "2.0"

[lints]
workspace = true
